[project]
name = "shizuku-djbclark-fork"
revision = "1.0"

# Secrets for djbclark's Shizuku fork (release signing). Managed by
# secretspec (https://secretspec.dev). Values live outside git.

[profiles.default]
SHIZUKU_RELEASE_KEYSTORE_B64 = { description = "Base64-encoded release signing keystore (.jks) for djbclark/Shizuku CI. Also stored as the KEYSTORE GitHub Actions secret.", required = true }
SHIZUKU_RELEASE_KEYSTORE_PASSWORD = { description = "Password for the release keystore and its key alias (PKCS12 -- same value for both). Also stored as KEYSTORE_PASSWORD / KEYSTORE_ALIAS_PASSWORD GitHub Actions secrets.", required = true }
SHIZUKU_RELEASE_KEYSTORE_ALIAS = { description = "Key alias in the release keystore. Also stored as the KEYSTORE_ALIAS GitHub Actions secret.", required = false, default = "shizuku-djbclark-release" }
