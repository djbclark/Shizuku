org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
# AGP 9 R8 optimized resource shrinking requires non-final resource IDs.
# Keep this true so release minify+shrinkResources works with the new R8 path.
android.nonFinalResIds=true
# AGP 9 defaults to a new DSL / variant API. Third-party Rikka plugins
# (autoresconfig, materialthemebuilder, refine) still look up the legacy
# AppExtension/BaseExtension types. Opt out of the new DSL until those
# plugins ship AGP 9-compatible releases. Built-in Kotlin stays enabled.
# Remove this when rikka tools support AGP 9 new DSL (required by AGP 10).
android.newDsl=false
